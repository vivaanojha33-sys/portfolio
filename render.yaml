services:
  - type: web
    name: vivaan-portfolio
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client && npm install --prefix server && npm run build --prefix server
    startCommand: NODE_ENV=production node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
